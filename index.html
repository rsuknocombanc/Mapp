#rightTools{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 174px);z-index:4;display:flex;flex-direction:column;gap:9px}.tool{width:49px;height:49px;display:grid;place-items:center;border:1.5px solid #766547;background:#f5ead2ed;color:#4d452d;border-radius:14px;box-shadow:0 3px 12px #47391f24;font:bold 27px Georgia;cursor:pointer}.tool:active,.choice:active{transform:scale(.96)}
#panel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:5;max-width:570px;margin:auto;background:#f1e7cfea;border:1px solid #8e7753;border-radius:19px;padding:15px 14px 13px;box-shadow:0 5px 25px #3b332643;backdrop-filter:blur(16px)}#panel .panelHeading{font-size:11px;letter-spacing:.2em;color:#8d4f2f;display:flex;justify-content:space-between;align-items:center;margin:1px 2px 10px}#panel .panelHeading b{font-weight:normal;color:#6f7951;letter-spacing:.08em}#choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.choice{font-family:Georgia;background:#faf5e6;border:1px solid #ae9b73;border-radius:12px;padding:9px 3px;display:flex;flex-direction:column;align-items:center;gap:7px;color:#4b432e;cursor:pointer}.choice.active{border:2px solid #a9502f;background:#f8e3c9;padding:8px 2px}.swatch{height:25px;width:calc(100% - 20px);border-radius:5px;box-shadow:inset 0 0 0 1px #65573350;background:linear-gradient(145deg,#d4d18f 22%,#899455 22% 40%,#e6d4a4 40% 52%,#b3ba7c 52% 69%,#a3c6c4 69% 73%,#d2d093 73%)}.choice:nth-child(2) .swatch{background:linear-gradient(135deg,#c5d18c 25%,#93a56d 25% 52%,#e2e2b6 52% 70%,#b4ced3 70% 76%,#9eae77 76%)}.choice:nth-child(3) .swatch{background:repeating-linear-gradient(150deg,#afb889 0 13px,#d7d2a4 13px 26px,#849476 26px 30px)}.choice span:last-child{font:11px system-ui,sans-serif;font-weight:600;letter-spacing:.01em}#status{margin-top:12px;padding-top:10px;border-top:1px solid #c4ac85;font:11px/1.4 system-ui,sans-serif;color:#655e49;display:flex;gap:8px;align-items:center}#status .dot{width:7px;height:7px;flex:none;border-radius:50%;background:#9e6a4e}#status.ok .dot{background:#657c43}
#demoTag{position:absolute;z-index:3;left:15px;top:calc(env(safe-area-inset-top) + 98px);background:#f0e2bfdb;border:1px solid #aa9670;border-radius:7px;padding:7px 10px;font:10px system-ui,sans-serif;letter-spacing:.05em;color:#69583c;pointer-events:none}

<body><div id="map"></div>
<header id="header"><div class="top"><span class="badge">✳</span><div><h1>MAPP</h1><small>ATLAS DE EXPEDICIÓN · SERIE 01</small></div></div><div class="rule"></div></header>
<div id="searchShell" role="search"><form id="searchForm" autocomplete="off"><input type="search" id="searchInput" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Buscar un lugar…" aria-label="Buscar lugares" aria-controls="searchResults" aria-expanded="false"/><button type="button" id="searchClear" title="Limpiar búsqueda" aria-label="Limpiar búsqueda">×</button><button type="submit" id="searchSubmit" aria-label="Buscar">⌕</button></form><div id="searchResults" role="listbox" aria-label="Resultados de búsqueda" aria-live="polite"></div></div>
<div id="demoTag">✦ EXPLORA · ANDES DE CHILE</div>
<button id="compass" aria-label="Orientar norte" title="Orientar al norte"><strong>N</strong><svg viewBox="0 0 40 40"><path d="M20 4L25 20L20 36L15 20Z" fill="#a44b24" stroke="#4b452e" stroke-width=".7"/><path d="M20 36L20 4L15 20Z" fill="#e7c48c"/></svg></button>
<div id="rightTools"><button class="tool" id="zoomIn" aria-label="Acercar">+</button><button class="tool" id="zoomOut" aria-label="Alejar">−</button><button class="tool" id="locate" aria-label="Mi ubicación" title="Mi ubicación">⌖</button></div>
<div id="panel"><div class="panelHeading"><span>COLECCIÓN DE MAPAS</span><b>EDICIÓN 0.3.1</b></div><div id="choices"><button class="choice active" data-style="vintage"><span class="swatch"></span><span>Vintage</span></button><button class="choice" data-style="flat"><span class="swatch"></span><span>Ilustrado</span></button><button class="choice" data-style="topo"><span class="swatch"></span><span>Topográfico</span></button></div><div id="elevationLegend" aria-label="Colores por elevación"><span class="legendTitle">COTAS</span><div class="bands"><span class="elevBand" data-band="0"></span><span class="elevBand" data-band="1"></span><span class="elevBand" data-band="2"></span><span class="elevBand" data-band="3"></span></div><span class="legendLabels">BAJA → ALTA</span></div><div id="status"><span class="dot"></span><span id="message">Cargando cartografía real…</span></div></div>
<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
<script>
/* MAP-0003: DEM hipsometría, buscador Photon y edificios sin extrusión. */
const START=[-70.323,-33.348]; // ubicación de demostración; NO es GPS del usuario
const styles={
 vintage:{background:'#f1e7c9',water:'#90acb0',park:'#9da889',wood:'#82957f',grass:'#b2b99a',road:'#b07a57',highway:'#a36844',building:'#c5b8a1',line:'#ac8f75',text:'#704a32',halo:'#f4e8cc',elevation:['#eee4c7','#e3ddb8','#c9caa3','#a6b39a','#c1b8a0'],hill:'#78644d'},
 flat:{background:'#f1e6c8',water:'#8faeb4',park:'#b8c2a1',wood:'#819a88',grass:'#c4c9ac',road:'#ae7f62',highway:'#ad6e4f',building:'#d7caba',line:'#ab9b7d',text:'#79553a',halo:'#f4e9cd',elevation:['#eee7cd','#dcd8b2','#c5c9a0','#a0b392','#bdb6a2'],hill:'#74745d'},
 topo:{background:'#ebe1c6',water:'#86a3a8',park:'#aab59b',wood:'#829385',grass:'#c1c8af',road:'#a58168',highway:'#926b52',building:'#c7bfaf',line:'#938b78',text:'#585642',halo:'#f5edd8',elevation:['#e9e2cc','#dad9bc','#b7c3a8','#92a999','#c7c2ad'],hill:'#677260'}
};
let selected='vintage',map,marker,searchMarker,gps=false,demReady=false,searchRequest=null,searchTimer=null,searchSeq=0,baseReady=false;
const STARTUP_TIMEOUT=20000;
const msg=(s,ok=false)=>{document.getElementById('message').textContent=s;document.getElementById('status').classList.toggle('ok',ok)};
// Top-down 5-door Jimny-inspired marker; original SVG, independent of copyrighted vehicle artwork.
const vehicle=`<div class="car" id="vehicle"><svg viewBox="0 0 58 86" xmlns="http://www.w3.org/2000/svg"><g stroke="#202520" stroke-linejoin="round"><rect x="8" y="5" width="42" height="76" rx="10" fill="#333a2f" stroke-width="2"/><rect x="4" y="14" width="8" height="18" rx="3" fill="#171c19" stroke-width="2"/><rect x="46" y="14" width="8" height="18" rx="3" fill="#171c19" stroke-width="2"/><rect x="4" y="53" width="8" height="18" rx="3" fill="#171c19" stroke-width="2"/><rect x="46" y="53" width="8" height="18" rx="3" fill="#171c19" stroke-width="2"/><rect x="10" y="5" width="38" height="75" rx="8" fill="#b85d27" stroke-width="1.7"/><path d="M13 19L45 19L42 32L16 32Z" fill="#627b7b" stroke-width="1.3"/><path d="M15 56L43 56L44 68L14 68Z" fill="#5b7170" stroke-width="1.3"/><path d="M14 34H44V53H14Z" fill="#a54c21" stroke-width="1.3"/><path d="M19 36V51M39 36V51M15 42H43" stroke="#44392b" stroke-width="1.4"/><rect x="14" y="9" width="30" height="6" rx="2" fill="#d48a43" stroke-width="1"/><path d="M14 73H44" stroke="#3d3026" stroke-width="3"/><circle cx="29" cy="75" r="8.2" fill="#1b2423" stroke-width="2"/><circle cx="29" cy="75" r="4" fill="#686c63" stroke-width="1"/></g><path d="M29 0L23 8H35Z" fill="#f4e5bf" stroke="#492f1c" stroke-width="1"/></svg></div>`;
// Four colored elevation classes + pale rocky summits (all elevations in meters).
// Step transitions are geographic bands, not repetitive texture stickers.
const elevationRamp=(theme)=>{
 const c=styles[theme].elevation;
 return ['step',['elevation'],c[0],650,c[1],1150,c[2],1900,c[3],3200,c[4]];
};
function setPaint(id,prop,value){try{map.setPaintProperty(id,prop,value)}catch(e){console.warn('Pintura:',id,prop,e?.message)}}
function setLayout(id,prop,value){try{map.setLayoutProperty(id,prop,value)}catch(e){console.warn('Layout:',id,prop,e?.message)}}
function recolor(theme){
 selected=theme;const p=styles[theme];document.getElementById('map').className=theme==='flat'?'smooth':theme==='topo'?'ink':'';
 document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.dataset.style===theme));
 document.querySelectorAll('.elevBand').forEach((el,i)=>el.style.backgroundColor=p.elevation[i]);
 if(!map||!map.isStyleLoaded())return;
 for(const layer of map.getStyle().layers){
  const id=layer.id,kind=layer.type,name=id.toLowerCase();if(id.startsWith('mapp-'))continue;
  if(kind==='fill-extrusion'){setLayout(id,'visibility','none');continue}
  if(kind==='background')setPaint(id,'background-color',p.background);
  if(kind==='fill'){
   let c=p.background,opacity=.045;
   if(/water|ocean|lake|river|wetland/.test(name)){c=p.water;opacity=.97}
   else if(/building/.test(name)){c=p.building;opacity=.33}
   else if(/wood|forest|tree/.test(name)){c=p.wood;opacity=.19}
   else if(/park|protected|national|garden/.test(name)){c=p.park;opacity=.17}
   else if(/grass|meadow|scrub|landcover|landuse|golf/.test(name)){c=p.grass;opacity=.11}
   setPaint(id,'fill-color',c);setPaint(id,'fill-opacity',opacity);
  }
  if(kind==='line'){
    let c=p.line,opacity=.70;
    if(/water|river|stream/.test(name)){c=p.water;opacity=.89}
    else if(/motorway|trunk|highway/.test(name)){c=p.highway;opacity=.78}
    else if(/road|street|path|track|rail/.test(name)){c=p.road;opacity=.70}
    setPaint(id,'line-color',c);setPaint(id,'line-opacity',opacity);
  }
  if(kind==='symbol'){
    setPaint(id,'text-color',p.text);setPaint(id,'text-halo-color',p.halo);
    setPaint(id,'text-halo-width',theme==='flat'?1.45:1.15);
  }
 }
 if(demReady){
   setPaint('mapp-elevation-bands','color-relief-color',elevationRamp(theme));
   setPaint('mapp-elevation-bands','color-relief-opacity',theme==='topo'?.96:.98);
   setPaint('mapp-relief','hillshade-shadow-color',p.hill);
   setPaint('mapp-relief','hillshade-exaggeration',theme==='topo'?.34:theme==='flat'?.21:.26);
 }
 msg(demReady?'Cotas reales · vista 2D · GPS opcional':'Mapa real · cotas pendientes de cargar',true);
}
function installArtLayers(){
 if(demReady)return;
 const layers=map.getStyle().layers;
 // DEM tint sits above large flat land fills, but below water, buildings, roads and labels.
 const firstWater=layers.find(l=>l.type==='fill'&&/water|ocean|lake/i.test(l.id));
 const firstLine=layers.find(l=>l.type==='line');
 const insertion=firstWater?.id||firstLine?.id||layers.find(l=>l.type==='symbol')?.id;
 if(!map.getSource('mapp-elevation'))map.addSource('mapp-elevation',{
   type:'raster-dem',url:'https://tiles.mapterhorn.com/tilejson.json',encoding:'terrarium',tileSize:512,attribution:'© Mapterhorn'
 });
 map.addLayer({id:'mapp-elevation-bands',type:'color-relief',source:'mapp-elevation',paint:{'color-relief-color':elevationRamp(selected),'color-relief-opacity':.98}},insertion);
 map.addLayer({id:'mapp-relief',type:'hillshade',source:'mapp-elevation',paint:{
   'hillshade-method':'standard','hillshade-illumination-direction':315,
   'hillshade-shadow-color':'#78644d','hillshade-highlight-color':'#fff1d9',
   'hillshade-accent-color':'#b6a789','hillshade-exaggeration':.26
 }},insertion);
 demReady=true;
}
async function start(){try{
 setTimeout(()=>{if(map&&!map.isStyleLoaded())msg('La cartografía no terminó de cargar. Verifica tu conexión.')},STARTUP_TIMEOUT);
 map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:START,zoom:12.3,bearing:0,pitch:0,attributionControl:false,maxPitch:0,renderWorldCopies:false});
 const el=document.createElement('div');el.innerHTML=vehicle;
 marker=new maplibregl.Marker({element:el,anchor:'center',rotationAlignment:'map'}).setLngLat(START).addTo(map);
 map.on('load',()=>{
  baseReady=true;
  try{installArtLayers()}catch(err){console.warn('Elevación opcional no disponible:',err.message);msg('Mapa base disponible; elevación no cargada',true)}
  recolor(selected);
  const a=document.createElement('div');a.style.cssText='position:absolute;bottom:0;left:0;z-index:3;font:9px system-ui;background:#f3e8ced8;padding:3px 7px;color:#705e45';
  a.textContent='© OpenStreetMap · OpenFreeMap · Mapterhorn';document.getElementById('map').append(a);
 });
 map.on('error',e=>{console.warn('Capa externa:',e?.error?.message||e);if(!baseReady)msg('Algunas capas no cargaron; comprueba tu conexión.')});
}catch(e){msg('No se pudo iniciar MapLibre: '+e.message)}}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>recolor(b.dataset.style)));
document.getElementById('zoomIn').onclick=()=>map&&map.zoomIn();document.getElementById('zoomOut').onclick=()=>map&&map.zoomOut();document.getElementById('compass').onclick=()=>map&&map.easeTo({bearing:0,pitch:0});

// Place search — Photon (OpenStreetMap). Only query on >=3 characters,
// debounce 750 ms; abort superseded requests, avoid high-volume traffic.
const searchInput=document.getElementById('searchInput'),searchResults=document.getElementById('searchResults');
const searchCache=new Map();
function searchShow(show){searchResults.classList.toggle('open',show);searchInput.setAttribute('aria-expanded',String(show))}
function searchMessage(message){searchResults.replaceChildren();const row=document.createElement('div');row.className='searchInfo';row.textContent=message;searchResults.append(row);searchShow(true)}
function searchReset(){clearTimeout(searchTimer);searchSeq++;searchRequest?.abort();searchRequest=null;searchResults.replaceChildren();searchShow(false)}
function searchLabel(feature){
 const a=feature.properties||{};const label=a.name||a.street||a.city||a.county||'Lugar sin nombre';
 const parts=[a.street&&a.street!==label?a.street:null,a.city&&a.city!==label?a.city:null,a.state,a.country].filter(Boolean);
 return {label,description:parts.join(' · ')};
}
function showSearchResult(features){
 searchResults.replaceChildren();
 if(!features.length){searchMessage('Sin resultados. Prueba otra localidad o dirección.');return}
 features.forEach(feature=>{
  const coords=feature?.geometry?.coordinates;
  if(!Array.isArray(coords)||coords.length<2||!coords.slice(0,2).every(Number.isFinite))return;
  const names=searchLabel(feature);const button=document.createElement('button');button.type='button';button.className='searchRow';button.setAttribute('role','option');button.textContent=names.label;
  const detail=document.createElement('small');detail.textContent=names.description||'Ubicación cartográfica';button.append(detail);
  button.onclick=()=>{
   const place=[coords[0],coords[1]];if(!map)return;
   if(searchMarker)searchMarker.remove();
   const pin=document.createElement('div');pin.setAttribute('aria-label','Lugar seleccionado');pin.style.cssText='width:18px;height:18px;background:#a85b35;border:3px solid #f3e5c6;border-radius:50%;box-shadow:0 0 0 2px #6a4934,0 3px 10px #372a1a80';
   searchMarker=new maplibregl.Marker({element:pin,anchor:'center'}).setLngLat(place).addTo(map);
   map.flyTo({center:place,zoom:Math.max(map.getZoom(),13),essential:true});
   searchInput.value=names.label;searchShow(false);document.getElementById('demoTag').textContent='✦ '+names.label.toLocaleUpperCase('es');
   msg('Lugar encontrado · '+names.label,true);
  };searchResults.append(button);
 });
 searchShow(!!searchResults.children.length);
}
async function searchPlaces(){
 const term=searchInput.value.trim();if(term.length<3){searchReset();if(term)searchMessage('Escribe al menos 3 caracteres.');return}
 const id=++searchSeq;searchRequest?.abort();searchRequest=new AbortController();
 if(searchCache.has(term.toLocaleLowerCase('es'))){showSearchResult(searchCache.get(term.toLocaleLowerCase('es')));return}
 searchMessage('Buscando lugares…');
 try{
  const center=map?.getCenter?.()||{lat:START[1],lng:START[0]};
  const params=new URLSearchParams({q:term,limit:'5',lang:'es',lat:String(center.lat),lon:String(center.lng)});
  const response=await fetch('https://photon.komoot.io/api/?'+params.toString(),{signal:searchRequest.signal,headers:{Accept:'application/json'}});
  if(!response.ok)throw Error('Servicio no disponible ('+response.status+')');
  const data=await response.json();if(id!==searchSeq)return;
  const features=Array.isArray(data.features)?data.features:[];
  searchCache.set(term.toLocaleLowerCase('es'),features);if(searchCache.size>30)searchCache.delete(searchCache.keys().next().value);
  showSearchResult(features);
 }catch(err){if(err.name!=='AbortError'&&id===searchSeq)searchMessage('No fue posible buscar. Reintenta más tarde.')}finally{if(id===searchSeq)searchRequest=null}
}
searchInput.addEventListener('input',()=>{
 clearTimeout(searchTimer);searchSeq++;searchRequest?.abort();searchRequest=null;
 const value=searchInput.value.trim();if(value.length<3){searchShow(false);return}
 searchTimer=setTimeout(searchPlaces,750);
});
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();clearTimeout(searchTimer);searchPlaces();searchInput.blur()});
document.getElementById('searchClear').addEventListener('click',()=>{searchInput.value='';searchReset();searchInput.focus()});
searchInput.addEventListener('keydown',e=>{if(e.key==='Escape'){searchReset();searchInput.blur()}});
document.addEventListener('pointerdown',e=>{if(!document.getElementById('searchShell').contains(e.target))searchShow(false)});
document.getElementById('locate').onclick=()=>{if(!navigator.geolocation){msg('Este navegador no admite GPS.');return}msg('Solicitando autorización de ubicación…');navigator.geolocation.getCurrentPosition(pos=>{gps=true;const ll=[pos.coords.longitude,pos.coords.latitude];marker.setLngLat(ll);map.flyTo({center:ll,zoom:15});document.getElementById('demoTag').textContent='MI UBICACIÓN · GPS';document.getElementById('vehicle').classList.add('pulse');msg('Ubicación GPS actualizada · precisión ±'+Math.round(pos.coords.accuracy)+' m',true)},err=>msg('GPS no disponible ('+err.message+'). Permanece la ubicación de demostración.'),{enableHighAccuracy:true,timeout:16000,maximumAge:0})};
start();
</script></body></html>
