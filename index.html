<!doctype html>
<html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/><meta name="theme-color" content="#e6d5ae"/><title>Mapp · Overland Vintage</title>
<link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<style>
:root{--ink:#413b29;--burn:#a44b24;--paper:#f3e8ce;--olive:#647047}*{box-sizing:border-box}html,body,#map{margin:0;height:100%;width:100%;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:var(--paper)}#map{position:absolute;inset:0}#map:after{content:"";pointer-events:none;position:absolute;inset:0;z-index:2;opacity:.31;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.19'/%3E%3C/svg%3E");mix-blend-mode:multiply}
#map.smooth:after{opacity:.11}#map.ink:after{opacity:.24}
#map .maplibregl-control-container{display:none}
#header{position:absolute;top:0;left:0;right:0;z-index:4;padding:calc(env(safe-area-inset-top) + 13px) 18px 14px;background:linear-gradient(#f6ebd4f2,#f6ebd4e8 85%,#f6ebd400);pointer-events:none}#header .top{display:flex;align-items:center;gap:9px}#header .badge{font-size:22px;color:var(--burn)}#header h1{font-size:24px;line-height:1;margin:0;font-weight:600;letter-spacing:.15em}#header small{display:block;font:10px system-ui,sans-serif;letter-spacing:.27em;margin-top:6px;color:#8b6244}#header .rule{height:1px;background:#9479568a;margin-top:12px}
#compass{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 107px);z-index:4;width:61px;height:61px;border:2px solid #6c5a33;background:#f8f0d9e8;border-radius:50%;box-shadow:0 2px 14px #382f2030;display:grid;place-items:center;font:bold 14px Georgia;cursor:pointer}#compass svg{height:43px;width:43px}#compass strong{position:absolute;top:2px;font:10px Georgia}
#rightTools{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 174px);z-index:4;display:flex;flex-direction:column;gap:9px}.tool{width:49px;height:49px;display:grid;place-items:center;border:1.5px solid #766547;background:#f5ead2ed;color:#4d452d;border-radius:14px;box-shadow:0 3px 12px #47391f24;font:bold 27px Georgia;cursor:pointer}.tool:active,.choice:active{transform:scale(.96)}
#panel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:5;max-width:570px;margin:auto;background:#f1e7cfea;border:1px solid #8e7753;border-radius:19px;padding:15px 14px 13px;box-shadow:0 5px 25px #3b332643;backdrop-filter:blur(16px)}#panel .panelHeading{font-size:11px;letter-spacing:.2em;color:#8d4f2f;display:flex;justify-content:space-between;align-items:center;margin:1px 2px 10px}#panel .panelHeading b{font-weight:normal;color:#6f7951;letter-spacing:.08em}#choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.choice{font-family:Georgia;background:#faf5e6;border:1px solid #ae9b73;border-radius:12px;padding:9px 3px;display:flex;flex-direction:column;align-items:center;gap:7px;color:#4b432e;cursor:pointer}.choice.active{border:2px solid #a9502f;background:#f8e3c9;padding:8px 2px}.swatch{height:25px;width:calc(100% - 20px);border-radius:5px;box-shadow:inset 0 0 0 1px #65573350;background:linear-gradient(145deg,#d4d18f 22%,#899455 22% 40%,#e6d4a4 40% 52%,#b3ba7c 52% 69%,#a3c6c4 69% 73%,#d2d093 73%)}.choice:nth-child(2) .swatch{background:linear-gradient(135deg,#c5d18c 25%,#93a56d 25% 52%,#e2e2b6 52% 70%,#b4ced3 70% 76%,#9eae77 76%)}.choice:nth-child(3) .swatch{background:repeating-linear-gradient(150deg,#afb889 0 13px,#d7d2a4 13px 26px,#849476 26px 30px)}.choice span:last-child{font:11px system-ui,sans-serif;font-weight:600;letter-spacing:.01em}#status{margin-top:12px;padding-top:10px;border-top:1px solid #c4ac85;font:11px/1.4 system-ui,sans-serif;color:#655e49;display:flex;gap:8px;align-items:center}#status .dot{width:7px;height:7px;flex:none;border-radius:50%;background:#9e6a4e}#status.ok .dot{background:#657c43}
#demoTag{position:absolute;z-index:3;left:15px;top:calc(env(safe-area-inset-top) + 98px);background:#f0e2bfdb;border:1px solid #aa9670;border-radius:7px;padding:7px 10px;font:10px system-ui,sans-serif;letter-spacing:.05em;color:#69583c;pointer-events:none}
.car{width:58px;height:86px;filter:drop-shadow(0 3px 4px #171b1490)}.car svg{width:58px;height:86px;display:block}.car.pulse:before{content:"";position:absolute;width:105px;height:105px;left:-24px;top:-9px;border-radius:50%;border:1px solid #bd5d3499;background:#be6c2d15;z-index:-1}
@media(max-height:640px){#panel{padding:10px}#panel .panelHeading{margin-bottom:7px}#rightTools{bottom:calc(env(safe-area-inset-bottom) + 159px)}#header h1{font-size:20px}}
</style></head>
<body><div id="map"></div>
<header id="header"><div class="top"><span class="badge">✦</span><div><h1>MAPP</h1><small>OVERLAND · EXPLORATION ATLAS</small></div></div><div class="rule"></div></header>
<div id="demoTag">CORDILLERA DE LOS ANDES · CHILE</div>
<button id="compass" aria-label="Orientar norte" title="Orientar al norte"><strong>N</strong><svg viewBox="0 0 40 40"><path d="M20 4L25 20L20 36L15 20Z" fill="#a44b24" stroke="#4b452e" stroke-width=".7"/><path d="M20 36L20 4L15 20Z" fill="#e7c48c"/></svg></button>
<div id="rightTools"><button class="tool" id="zoomIn" aria-label="Acercar">+</button><button class="tool" id="zoomOut" aria-label="Alejar">−</button><button class="tool" id="locate" aria-label="Mi ubicación" title="Mi ubicación">⌖</button></div>
<div id="panel"><div class="panelHeading"><span>ESTILO DEL MAPA</span><b>PROTOTIPO 0.2</b></div><div id="choices"><button class="choice active" data-style="vintage"><span class="swatch"></span><span>Vintage</span></button><button class="choice" data-style="flat"><span class="swatch"></span><span>Ilustrado</span></button><button class="choice" data-style="topo"><span class="swatch"></span><span>Topográfico</span></button></div><div id="status"><span class="dot"></span><span id="message">Cargando cartografía real…</span></div></div>
<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
<script>
const START=[-70.323,-33.348]; // ubicación de demostración; NO es GPS del usuario
const styles={
 vintage:{background:'#e9dcad',water:'#a9c9c5',park:'#b3b678',wood:'#849454',grass:'#c8c68c',road:'#d0a46e',highway:'#ae754b',building:'#baad88',line:'#aca478',text:'#71512e',halo:'#f7eac5',contour:'#b2a679'},
 flat:{background:'#f2eed4',water:'#aaccc9',park:'#c7d18e',wood:'#9caa6d',grass:'#e1dda2',road:'#bd8b5f',highway:'#aa7147',building:'#d6c8a4',line:'#c7c399',text:'#955b33',halo:'#f7f1dc',contour:'#d3cb93'},
 topo:{background:'#e0dfc3',water:'#9fbbb9',park:'#b4bb91',wood:'#8d9e7a',grass:'#ced2a9',road:'#b49b75',highway:'#9a704f',building:'#b1a993',line:'#9d9b80',text:'#5b5640',halo:'#e8e8d2',contour:'#9ba180'}
};
let selected='vintage',map,marker,gps=false;
const msg=(s,ok=false)=>{document.getElementById('message').textContent=s;document.getElementById('status').classList.toggle('ok',ok)};
// Top-down 5-door Jimny-inspired marker; original SVG, independent of copyrighted vehicle artwork.
const vehicle=`<div class="car" id="vehicle"><svg viewBox="0 0 58 86" xmlns="http://www.w3.org/2000/svg"><g stroke="#202520" stroke-linejoin="round"><rect x="8" y="5" width="42" height="76" rx="10" fill="#333a2f" stroke-width="2"/><rect x="4" y="14" width="8" height="18" rx="3" fill="#171c19" stroke-width="2"/><rect x="46" y="14" width="8" height="18" rx="3" fill="#171c19" stroke-width="2"/><rect x="4" y="53" width="8" height="18" rx="3" fill="#171c19" stroke-width="2"/><rect x="46" y="53" width="8" height="18" rx="3" fill="#171c19" stroke-width="2"/><rect x="10" y="5" width="38" height="75" rx="8" fill="#b85d27" stroke-width="1.7"/><path d="M13 19L45 19L42 32L16 32Z" fill="#627b7b" stroke-width="1.3"/><path d="M15 56L43 56L44 68L14 68Z" fill="#5b7170" stroke-width="1.3"/><path d="M14 34H44V53H14Z" fill="#a54c21" stroke-width="1.3"/><path d="M19 36V51M39 36V51M15 42H43" stroke="#44392b" stroke-width="1.4"/><rect x="14" y="9" width="30" height="6" rx="2" fill="#d48a43" stroke-width="1"/><path d="M14 73H44" stroke="#3d3026" stroke-width="3"/><circle cx="29" cy="75" r="8.2" fill="#1b2423" stroke-width="2"/><circle cx="29" cy="75" r="4" fill="#686c63" stroke-width="1"/></g><path d="M29 0L23 8H35Z" fill="#f4e5bf" stroke="#492f1c" stroke-width="1"/></svg></div>`;
function setColor(id,prop,color){try{map.setPaintProperty(id,prop,color)}catch(e){}}
function recolor(theme){selected=theme;const p=styles[theme];document.getElementById('map').className=theme==='flat'?'smooth':theme==='topo'?'ink':'';if(!map||!map.isStyleLoaded())return;
 for(const layer of map.getStyle().layers){let id=layer.id,kind=layer.type,name=id.toLowerCase();if(kind==='background')setColor(id,'background-color',p.background);
 if(kind==='fill'){let c=p.grass;if(/water|ocean|lake|river|wetland/.test(name))c=p.water;else if(/wood|forest|tree/.test(name))c=p.wood;else if(/park|protected|national/.test(name))c=p.park;else if(/building/.test(name))c=p.building;else if(/landcover|landuse|grass|meadow|scrub/.test(name))c=p.grass;else c=p.background;setColor(id,'fill-color',c)}
 if(kind==='line'){let c=p.line;if(/water|river|stream/.test(name))c=p.water;else if(/motorway|trunk|highway/.test(name))c=p.highway;else if(/road|street|path|track|rail/.test(name))c=p.road;else if(/contour/.test(name))c=p.contour;setColor(id,'line-color',c)}
 if(kind==='symbol'){setColor(id,'text-color',p.text);setColor(id,'text-halo-color',p.halo);setColor(id,'text-halo-width',theme==='flat'?1.5:1.05)}
 }
 document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.dataset.style===theme));msg('Mapa real · vista vertical · marcador Jimny de demostración',true);
}
async function start(){try{
 map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:START,zoom:12.3,bearing:0,pitch:0,attributionControl:false,maxPitch:0});
 const el=document.createElement('div');el.innerHTML=vehicle;marker=new maplibregl.Marker({element:el,anchor:'center',rotationAlignment:'map'}).setLngLat(START).addTo(map);
 map.on('load',()=>{recolor(selected);const a=document.createElement('div');a.style.cssText='position:absolute;bottom:0;left:0;z-index:3;font:9px system-ui;background:#f3e8ced8;padding:3px 7px;color:#705e45';a.textContent='© OpenStreetMap contributors · OpenFreeMap';document.getElementById('map').append(a)});
 map.on('error',e=>{if(!map.loaded())msg('No se pudo cargar el mapa. Comprueba tu conexión.')});
}catch(e){msg('No se pudo iniciar MapLibre: '+e.message)}}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>recolor(b.dataset.style)));
document.getElementById('zoomIn').onclick=()=>map&&map.zoomIn();document.getElementById('zoomOut').onclick=()=>map&&map.zoomOut();document.getElementById('compass').onclick=()=>map&&map.easeTo({bearing:0,pitch:0});
document.getElementById('locate').onclick=()=>{if(!navigator.geolocation){msg('Este navegador no admite GPS.');return}msg('Solicitando autorización de ubicación…');navigator.geolocation.getCurrentPosition(pos=>{gps=true;const ll=[pos.coords.longitude,pos.coords.latitude];marker.setLngLat(ll);map.flyTo({center:ll,zoom:15});document.getElementById('demoTag').textContent='MI UBICACIÓN · GPS';document.getElementById('vehicle').classList.add('pulse');msg('Ubicación GPS actualizada · precisión ±'+Math.round(pos.coords.accuracy)+' m',true)},err=>msg('GPS no disponible ('+err.message+'). Permanece la ubicación de demostración.'),{enableHighAccuracy:true,timeout:16000,maximumAge:0})};
start();
</script></body></html>
