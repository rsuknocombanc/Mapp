name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate map and route prototype
        run: |
          python3 tests/check_contract.py
          node --check assets/app.js
          node tests/test_route_logic.js
          python3 - <<'PY'
          from pathlib import Path
          for p in ['AGENTS.md','METODOLOGIA.md','docs/CONTEXTO.md','docs/BITACORA.md','docs/REQUERIMIENTOS/MAP-0004.md','docs/REQUERIMIENTOS/MAP-0005.md','docs/DECISIONES/ADR-0004.md','docs/DECISIONES/ADR-0005.md','docs/PRUEBAS/UAT-MAP-0004.md','docs/PRUEBAS/UAT-MAP-0005.md']:
              assert Path(p).is_file(),p
          PY
