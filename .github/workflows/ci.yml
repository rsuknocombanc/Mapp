name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contract, sprites and route logic
        run: |
          python3 tests/check_contract.py
          node --check assets/app.js
          node --check assets/forest.js
          node tests/test_route_logic.js
          node tests/test_forest_logic.js
          python3 - <<'PY'
          from pathlib import Path
          for p in ['AGENTS.md','METODOLOGIA.md','docs/CONTEXTO.md','docs/BITACORA.md','docs/REQUERIMIENTOS/MAP-0007.md','docs/REQUERIMIENTOS/MAP-0008.md','docs/REQUERIMIENTOS/MAP-0009.md','docs/DECISIONES/ADR-0009.md','docs/PRUEBAS/UAT-MAP-0009.md','assets/trees/watercolor-atlas.png']:
              assert Path(p).is_file(),p
          PY